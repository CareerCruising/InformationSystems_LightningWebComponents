<template>
    <div class="slds-grid slds-grid_align-end slds-grid_vertical-align-center">
        <div class="slds-col slds-size_1-of-1 slds-text-align_right">
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading local time" size="small"></lightning-spinner>
            </template>
            <template if:true={hasTime}>
                <div class="slds-text-heading_medium" title={timezoneKey}>{displayedTime}</div>
                <div class="slds-text-color_weak slds-text-body_small">{localTimeLabel}</div>
            </template>
            <template if:true={errorMessage}>
                <div class="slds-text-color_error slds-text-body_small">{errorMessage}</div>
            </template>
        </div>
    </div>
</template>
